# Codemagic CI/CD — build iOS na nuvem sem precisar de Mac.
#
# Plano gratuito: 500 minutos/mês de macOS M2 (conta pessoal).
# Um build de iOS release consome ~15-20 min, então dá para ~25 builds/mês.
#
# COMO USAR:
# 1. Crie conta em https://codemagic.io (login com GitHub)
# 2. Conecte o repositório (pode ser privado)
# 3. O codemagic.yaml na raiz é detectado automaticamente
# 4. Crie o grupo de variáveis `supabase_credentials`
#    (App Settings > Environment variables > Group: supabase_credentials):
#      SUPABASE_URL      = https://vwstkxemtkdlsagricsh.supabase.co
#      SUPABASE_ANON_KEY = eyJ... (a mesma do env/prod.json local)
#    O env/prod.json é gitignored, então não vem no repositório — o script
#    `write_env_prod` abaixo o recria a partir dessas variáveis.
# 5. Comece pelo workflow `ios-unsigned` para validar que compila
# 6. Para o workflow `ios-release` (signed), suba os certificados Apple:
#    - App Settings > Code signing > iOS
#    - Upload do .p12 (exportado do Keychain Access de um Mac, ou gerado
#      via developer.apple.com) e do provisioning profile
#    - Reference name: "veredas_distribution"
#    - Distribution type: app_store
# 7. Para publicar na App Store, cadastre a App Store Connect API key
#    (App Store Connect > Users and Access > Keys > Generate API key) como
#    *integração* no Codemagic — Settings > Integrations > App Store Connect —
#    com o mesmo nome usado em `integrations:` no workflow ios-release.
#    Com `auth: integration` nenhum grupo de variáveis é necessário para isso.
#
# NUMERAÇÃO DE BUILD: o pubspec fica em 1.0.0+1 e não é tocado a cada envio.
# Quem define o CFBundleVersion/versionCode dos builds de CI é o
# $PROJECT_BUILD_NUMBER (o índice incremental do build no Codemagic), passado
# via --build-number. Sem isso o TestFlight recusa o segundo envio com
# "The provided entity includes an attribute with a value that has already
# been used" (ENTITY_ERROR.ATTRIBUTE.INVALID.DUPLICATE).

definitions:
  env_versions: &env_versions
    flutter: stable
    xcode: latest
    cocoapods: default

  # NÃO redeclare SUPABASE_URL/SUPABASE_ANON_KEY em `vars:`.
  #
  # O Codemagic não expande `$VAR` dentro de `vars:` — uma linha
  # `SUPABASE_URL: $SUPABASE_URL` grava a **string literal** `$SUPABASE_URL` e
  # ainda sobrescreve o valor real vindo do grupo. O app compila, sobe com uma
  # URL inválida, e todo login morre num erro genérico. A fonte das
  # credenciais é só o grupo `supabase_credentials`.
  write_env_prod: &write_env_prod
    name: Recriar env/prod.json (gitignored)
    script: |
      set -e
      if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
        echo "ERRO: SUPABASE_URL/SUPABASE_ANON_KEY vazias."
        echo "Defina as duas no grupo 'supabase_credentials' em"
        echo "App Settings > Environment variables e rode de novo."
        exit 1
      fi
      case "$SUPABASE_URL" in
        https://*) ;;
        *)
          echo "ERRO: SUPABASE_URL não parece uma URL: '$SUPABASE_URL'"
          echo "Se isso saiu literalmente como '\$SUPABASE_URL', a variável"
          echo "foi redeclarada em 'vars:' — remova de lá."
          exit 1
          ;;
      esac
      mkdir -p env
      cat > env/prod.json << EOF
      {
        "SUPABASE_URL": "$SUPABASE_URL",
        "SUPABASE_ANON_KEY": "$SUPABASE_ANON_KEY"
      }
      EOF
      echo "env/prod.json gerado apontando para $SUPABASE_URL"

  # lib/l10n/app_localizations*.dart e todos os *.g.dart são gitignored (ver
  # .gitignore) — precisam ser gerados aqui, senão o compilador não encontra
  # AppDatabase.into/delete/etc.
  flutter_codegen: &flutter_codegen
    name: Dependências e geração de código (l10n, drift, freezed, json)
    script: |
      set -e
      flutter pub get
      flutter gen-l10n
      dart run build_runner build --delete-conflicting-outputs

workflows:
  # -----------------------------------------------------------------------
  # Workflow 1: iOS unsigned — valida que o projeto compila na nuvem.
  # Rode este PRIMEIRO, antes de configurar certificados.
  # -----------------------------------------------------------------------
  ios-unsigned:
    name: iOS (unsigned, validação)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      <<: *env_versions
      groups:
        - supabase_credentials
    scripts:
      - *write_env_prod
      - *flutter_codegen
      - name: Build iOS debug sem assinatura (simulador)
        # --simulator evita a exigência de Development Team/Provisioning
        # Profile que o build para dispositivo físico teria mesmo com
        # --no-codesign. Isto só valida que o projeto compila; para
        # instalar no iPhone de verdade é preciso o workflow ios-release
        # com certificados Apple configurados.
        script: flutter build ios --simulator --no-codesign --dart-define-from-file=env/prod.json
    artifacts:
      - build/ios/iphonesimulator/Runner.app
      - /tmp/xcodebuild_logs/*.log

  # -----------------------------------------------------------------------
  # Workflow 2: iOS release signed — gera .ipa para TestFlight/App Store.
  # Requer certificados Apple configurados no Codemagic (ver instruções
  # no topo do arquivo).
  # -----------------------------------------------------------------------
  ios-release:
    name: iOS (release assinado)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      # Nome da integração App Store Connect cadastrada em
      # Codemagic > Team settings > Integrations > App Store Connect.
      # Troque "veredas_app_store_connect" pelo nome que você der lá.
      app_store_connect: veredas_app_store_connect
    environment:
      <<: *env_versions
      groups:
        - supabase_credentials
      ios_signing:
        distribution_type: app_store
        bundle_identifier: br.com.veredas.app
    scripts:
      - *write_env_prod
      - *flutter_codegen
      - name: Configurar assinatura iOS
        # Aplica o provisioning profile ao Runner. O target declara
        # CODE_SIGN_ENTITLEMENTS = Runner/Runner.entitlements
        # (keychain-access-groups), necessário para o flutter_secure_storage
        # conseguir ler o Keychain num build de distribuição.
        script: xcode-project use-profiles
      - name: Build IPA release
        # --build-number vem do índice do build no Codemagic, que sempre
        # incrementa. O App Store Connect exige um CFBundleVersion maior que
        # o do último envio da mesma versão; com o pubspec fixo em 1.0.0+1
        # todo segundo upload era recusado como duplicado.
        script: |
          set -e
          flutter build ipa --release \
            --build-number="$PROJECT_BUILD_NUMBER" \
            --dart-define-from-file=env/prod.json \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      # Publica no TestFlight automaticamente após o build.
      #
      # `auth: integration` pega a API key da integração declarada em
      # `integrations:` acima — NÃO precisa (e não deve) listar um grupo
      # app_store_credentials com APP_STORE_CONNECT_*. Um grupo que não
      # existe faz o build falhar na validação do yaml, antes de rodar
      # qualquer passo: "references to unknown variable group(s)".
      app_store_connect:
        auth: integration

  # -----------------------------------------------------------------------
  # Workflow 3: Android release AAB — equivalente ao build local.
  # -----------------------------------------------------------------------
  android-release:
    name: Android (release AAB)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      <<: *env_versions
      groups:
        - supabase_credentials
    scripts:
      - *write_env_prod
      - *flutter_codegen
      - name: Build AAB release
        # Mesmo motivo do iOS: a Play Store recusa um AAB com versionCode
        # igual ou menor que o do último envio.
        script: |
          set -e
          flutter build appbundle --release \
            --build-number="$PROJECT_BUILD_NUMBER" \
            --dart-define-from-file=env/prod.json
    artifacts:
      - build/app/outputs/bundle/release/*.aab
